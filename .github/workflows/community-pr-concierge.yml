name: Community PR concierge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  welcome:
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Label and guide external contributor
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create community-contribution --color 1D76DB --description 'External community contribution to MergeEarn' --force
          gh pr edit "$PR_NUMBER" --add-label community-contribution

          marker='<!-- mergeearn-community-concierge -->'
          existing="$(gh pr view "$PR_NUMBER" --json comments --jq '[.comments[].body | contains("<!-- mergeearn-community-concierge -->")] | any')"
          if [ "$existing" = "true" ]; then
            exit 0
          fi

          cat > /tmp/comment.md <<'EOF'
          <!-- mergeearn-community-concierge -->
          Thanks for contributing to MergeEarn.
          
          **Before treating this as paid bounty work:** confirm the linked task is `FUNDED` in the live app. GitHub comments or screenshots are not payment proof.
          
          - Live bounty board: https://github.com/Saidur-droid/MergeEarn/issues/33
          - Live app: https://mergeearn.vercel.app
          - Contribution rules: https://github.com/Saidur-droid/MergeEarn/blob/main/CONTRIBUTING.md
          
          For bounty-eligible work, the expected lifecycle is:
          
          `FUNDED -> claim -> PR -> merge -> GitHub verification -> maintainer approval -> Nimiq payout verification -> PAID`
          
          Please keep CI green and do not weaken GitHub repository/base/merge verification or Nimiq recipient/amount/sender/inclusion checks.
          EOF
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md