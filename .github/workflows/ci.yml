name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Inspect failed Nimiq testnet payout transaction
        run: |
          curl -fsS 'https://v2.test.nimiqwatch.com/api/v1/transaction/7dd3034da59c8d28a3ecb14fed4d88325cd20d2795ca218cae4aa6b113437f86'

      - name: Scan repository and history for secret patterns
        run: npm run scan:secrets

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
