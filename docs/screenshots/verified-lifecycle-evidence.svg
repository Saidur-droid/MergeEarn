<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="MergeEarn Verified Funding, Merge, and Payout Evidence">
  <rect width="880" height="260" rx="12" fill="#0b1020"/>
  <rect x="20" y="20" width="840" height="220" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  <text x="44" y="54" fill="#f9fafb" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Server-Verified Funding, Pull Request Merge, and Payout Evidence</text>
  <g transform="translate(44, 76)">
    <rect width="250" height="136" rx="8" fill="#1e293b" stroke="#059669"/>
    <text x="16" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. FUNDING VERIFIED (Nimiq)</text>
    <text x="16" y="54" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Server checks RPC tx recipient,</text>
    <text x="16" y="72" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">amount, execution &amp; inclusion.</text>
    <text x="16" y="102" fill="#94a3b8" font-family="monospace" font-size="11">Tx: e0aecb2d...4a596345</text>
    <text x="16" y="120" fill="#34d399" font-family="monospace" font-size="11">State -> FUNDED</text>
  </g>
  <g transform="translate(315, 76)">
    <rect width="250" height="136" rx="8" fill="#1e293b" stroke="#2563eb"/>
    <text x="16" y="28" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. MERGE VERIFIED (GitHub)</text>
    <text x="16" y="54" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Server validates repo, base branch,</text>
    <text x="16" y="72" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">issue link (#1) &amp; merged PR (#5).</text>
    <text x="16" y="102" fill="#94a3b8" font-family="monospace" font-size="11">Source: Issue #1 / PR #5</text>
    <text x="16" y="120" fill="#60a5fa" font-family="monospace" font-size="11">State -> VERIFIED -> APPROVED</text>
  </g>
  <g transform="translate(586, 76)">
    <rect width="250" height="136" rx="8" fill="#1e293b" stroke="#d97706"/>
    <text x="16" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. PAYOUT VERIFIED (Nimiq)</text>
    <text x="16" y="54" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Server verifies expected payout</text>
    <text x="16" y="72" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">sender, claimant &amp; NIM amount.</text>
    <text x="16" y="102" fill="#94a3b8" font-family="monospace" font-size="11">Tx: 7dd3034d...113437f86</text>
    <text x="16" y="120" fill="#fbbf24" font-family="monospace" font-size="11">State -> PAID</text>
  </g>
</svg>
