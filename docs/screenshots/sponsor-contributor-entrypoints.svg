<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="MergeEarn Sponsor and Contributor Entry Points">
  <rect width="880" height="220" rx="12" fill="#0b1020"/>
  <rect x="20" y="20" width="840" height="180" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  <text x="44" y="52" fill="#f9fafb" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Sponsor &amp; Contributor Entry Points</text>
  <g transform="translate(44, 72)">
    <rect width="380" height="104" rx="8" fill="#1f2937"/>
    <text x="18" y="28" fill="#f9fafb" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Contributor Path (GitHub-First)</text>
    <text x="18" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">1. Join contributor pool with GitHub OAuth (no wallet needed up front)</text>
    <text x="18" y="72" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">2. Connect Nimiq Pay only when claiming a FUNDED bounty</text>
    <text x="18" y="92" fill="#60a5fa" font-family="monospace" font-size="11">https://mergeearn.vercel.app/api/auth/github</text>
  </g>
  <g transform="translate(456, 72)">
    <rect width="380" height="104" rx="8" fill="#1f2937"/>
    <text x="18" y="28" fill="#f9fafb" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Sponsor &amp; Maintainer Path (Nimiq Pay)</text>
    <text x="18" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">1. Select eligible issue from Live Board (#33) or repository</text>
    <text x="18" y="72" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">2. Fund in Nimiq Pay; server verifies tx before marking FUNDED</text>
    <text x="18" y="92" fill="#34d399" font-family="monospace" font-size="11">https://mergeearn.vercel.app</text>
  </g>
</svg>
